<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Hangar — prototype of the Textron Select parts app proposed by Altitude Partners (Kansas State University) for the Textron Aviation case competition.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFFFF">
<title>Hangar Parts App</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
[hidden]{display:none!important}
img{max-width:100%}
</style>
<style>
/* Layout: one phone-width app column (max 430px) on a quiet grey backdrop; full-bleed on phones. */
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --surface-2:#F1F3F6; --line:#E6E9EE; --line-2:#D5DAE1;
  --ink:#121826; --ink-2:#4B5565; --ink-3:#8A94A6;
  --brand:#FFC72C; --brand-ink:#1A1400; --brand-deep:#E6AE00;
  --navy:#0F2A4A; --blue:#1F5EDB; --blue-soft:#E8F0FD;
  --green:#15803D; --green-soft:#E7F6EC; --red:#C2410C; --red-soft:#FDEEE6;
  --font:'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,Arial,sans-serif;
  --backdrop:#DFE2E7;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --backdrop:#15181D; color-scheme:dark } }
:root[data-theme="dark"]{ --backdrop:#15181D; color-scheme:dark }
html,body{height:100%}
body{margin:0;background:var(--backdrop);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0;text-align:left}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
img{max-width:100%;display:block}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}

.stage{min-height:100%;display:flex;justify-content:center;align-items:flex-start}
.phone{position:relative;width:100%;max-width:430px;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:600px){
  .stage{padding-block:24px}
  .phone{min-height:0;height:860px;border-radius:44px;box-shadow:0 24px 60px rgba(0,0,0,.28),0 0 0 11px #111317,0 0 0 13px #2A2D33}
}

/* Header */
.hdr{background:var(--surface);padding:12px 16px 10px;display:flex;flex-direction:column;gap:10px;flex-shrink:0;border-bottom:1px solid var(--line)}
.hdr-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wordmark{display:flex;align-items:center;gap:8px}
.wordmark .mark{width:30px;height:30px;border-radius:7px;background:var(--brand);display:grid;place-items:center}
.wordmark b{font-size:19px;font-weight:800;letter-spacing:-.4px}
.hdr-icons{display:flex;gap:2px}
.icon-btn{position:relative;width:42px;height:42px;display:grid;place-items:center;border-radius:10px;color:var(--ink)}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:22px;height:22px}
.dot{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid var(--surface)}
.cnt{position:absolute;top:4px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--brand);color:var(--brand-ink);font-size:11px;font-weight:800;display:grid;place-items:center}
.search{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:10px;padding:0 12px;height:44px;border:1px solid transparent}
.search:focus-within{border-color:var(--line-2);background:var(--surface)}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:14.5px;color:var(--ink);height:42px}
.search input::placeholder{color:var(--ink-3)}
.search svg{width:20px;height:20px;color:var(--ink-3);flex-shrink:0}
.acft-btn{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px 0 8px;border-radius:8px;background:var(--blue-soft);color:var(--navy);font-size:12.5px;font-weight:600;width:fit-content;max-width:100%}
.acft-btn img{width:22px;height:22px;border-radius:4px;object-fit:cover}
.acft-btn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acft-btn svg{width:16px;height:16px;flex-shrink:0;color:var(--blue)}

/* Screens */
.screens{flex:1;min-height:0;position:relative}
.screen{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:22px;padding:14px 0 96px;-webkit-overflow-scrolling:touch}
.screen > *{flex-shrink:0}
.screen[hidden]{display:none}
.px{padding-left:16px;padding-right:16px}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;padding:0 16px}
.sec-h h2{font-size:17px;font-weight:700;letter-spacing:-.2px}
.sec-h p{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.link{font-size:13px;font-weight:600;color:var(--blue);display:inline-flex;align-items:center;gap:2px}
.link svg{width:16px;height:16px}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding:4px 16px 8px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll > *{scroll-snap-align:start;flex:0 0 auto}

/* Promo carousel */
.promo{width:calc(100% - 44px);max-width:330px;height:158px;border-radius:10px;overflow:hidden;position:relative;display:flex;color:#fff}
.promo .txt{position:relative;z-index:1;width:64%;padding:14px 14px 14px 16px;display:flex;flex-direction:column;justify-content:space-between}
.promo .txt small{font-size:11.5px;font-weight:700;color:var(--brand);letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.promo .txt h3{font-size:16px;line-height:1.2;font-weight:800;margin-top:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.promo .txt .cta{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:6px;background:#fff;color:var(--ink);font-size:12.5px;font-weight:700;width:fit-content}
.promo img{position:absolute;right:0;top:0;width:52%;height:100%;object-fit:cover}
.promo .fade{position:absolute;inset:0;background:linear-gradient(90deg,var(--c) 44%,rgba(0,0,0,0) 72%)}
.dots{display:flex;justify-content:center;gap:5px;margin-top:-2px}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--line-2);transition:width .2s}
.dots i.on{width:18px;background:var(--ink)}

/* Category circles */
.cats{display:flex;gap:14px;overflow-x:auto;padding:2px 16px 6px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:7px;width:68px;font-size:11.5px;font-weight:600;color:var(--ink-2);text-align:center;line-height:1.15}
.cat .ring{width:64px;height:64px;border-radius:12px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.cat .ring img{width:100%;height:100%;object-fit:cover}

/* Product cards */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 16px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-width:0;width:100%}
.hscroll .card{width:164px}
.card .ph{position:relative;aspect-ratio:1;background:var(--surface-2);overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover}
.card .ph.pad img{object-fit:contain;padding:10px;background:#fff}
.heart{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--ink-2);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.heart svg{width:17px;height:17px}
.heart[aria-pressed="true"]{color:var(--red)}
.heart[aria-pressed="true"] svg{fill:currentColor}
.card .body{padding:10px 11px 11px;display:flex;flex-direction:column;gap:4px;flex:1}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;color:var(--navy);background:var(--blue-soft);padding:2px 6px;border-radius:4px;width:fit-content}
.tag.sel{color:#6B4F00;background:#FFF1C2}
.card .nm{font-size:13px;font-weight:600;line-height:1.3;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.rate{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--ink-2)}
.rate svg{width:12px;height:12px;color:var(--brand-deep)}
.rate b{color:var(--ink);font-weight:700}
.pr{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.pr b{font-size:16px;font-weight:800;letter-spacing:-.2px}
.pr s{font-size:12px;color:var(--ink-3)}
.pr em{font-style:normal;font-size:11.5px;font-weight:700;color:var(--green)}
.add{position:absolute;right:10px;bottom:10px;width:34px;height:34px;border-radius:9px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.14)}
.add svg{width:18px;height:18px}
.card.list{flex-direction:row;align-items:stretch}
.card.list .ph{width:110px;flex-shrink:0;aspect-ratio:auto}
.card.list .nm{min-height:0}
.fit{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--green);font-weight:600}
.fit svg{width:13px;height:13px}
.fit.no{color:var(--ink-3)}

/* Chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:36px;padding:0 14px;border-radius:8px;background:var(--surface);border:1px solid var(--line-2);font-size:13px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

/* Lists & panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin:0 16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--line);min-height:56px;width:100%}
.row:first-child{border-top:0}
.row .th{width:54px;height:54px;border-radius:8px;overflow:hidden;background:var(--surface-2);flex-shrink:0}
.row .th img{width:100%;height:100%;object-fit:cover}
.row .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t b{font-size:14px;font-weight:600;line-height:1.25}
.row .t span{font-size:12.5px;color:var(--ink-2)}
.row .r{font-size:14px;font-weight:700;white-space:nowrap}
.row .chev{width:18px;height:18px;color:var(--ink-3);flex-shrink:0}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:5px;width:fit-content}
.pill.warn{background:#FFF1C2;color:#6B4F00}
.pill.due{background:var(--red-soft);color:var(--red)}
.pill.ok{background:var(--green-soft);color:var(--green)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 20px;border-radius:10px;font-weight:700;font-size:15px;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:#FFD24D}
.btn.dark{background:var(--ink);color:#fff}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.block{width:100%}
.btn.sm{height:38px;padding:0 14px;font-size:13px;border-radius:8px}

/* Product page */
.pd-top{display:flex;align-items:center;justify-content:space-between;padding:0 10px;margin-top:-6px}
.gallery{position:relative;margin:0 16px;border-radius:12px;overflow:hidden;background:#fff;border:1px solid var(--line)}
.gallery .track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gallery .track::-webkit-scrollbar{display:none}
.gallery .track > div{flex:0 0 100%;scroll-snap-align:start;aspect-ratio:1.08;display:grid;place-items:center;background:#fff}
.gallery .track img{width:100%;height:100%;object-fit:cover}
.gallery .track .pad img{object-fit:contain;padding:22px}
.gallery .dots{position:absolute;bottom:10px;left:0;right:0}
.pd-h{display:flex;flex-direction:column;gap:8px;padding:0 16px}
.pd-h h1{font-size:21px;font-weight:800;line-height:1.2;letter-spacing:-.3px}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.meta .rate{font-size:12.5px}
.pd-price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pd-price b{font-size:26px;font-weight:800;letter-spacing:-.5px}
.pd-price s{font-size:14px;color:var(--ink-3)}
.pd-price em{font-style:normal;font-size:13px;font-weight:700;color:var(--green);background:var(--green-soft);padding:2px 7px;border-radius:6px}
.opts{display:flex;flex-direction:column;gap:8px;padding:0 16px}
.opt{display:flex;align-items:center;gap:12px;padding:12px 13px;border:1.5px solid var(--line-2);border-radius:10px;background:var(--surface);width:100%}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt.na{opacity:.75}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line-2);flex-shrink:0;display:grid;place-items:center}
.opt[aria-pressed="true"] .radio{border-color:var(--ink)}
.opt[aria-pressed="true"] .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--ink)}
.opt .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.opt .t b{font-size:14px;font-weight:700}
.opt .t span{font-size:12px;color:var(--ink-2)}
.opt .t span.bad{color:var(--red)}
.opt .p{font-size:15px;font-weight:800;white-space:nowrap}
.opt .p small{display:block;font-size:11px;font-weight:600;color:var(--ink-3);text-align:right}
.note{padding:0 16px;font-size:12.5px;color:var(--ink-2);line-height:1.45}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:0 16px}
.specs div{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.specs dt{font-size:11.5px;color:var(--ink-3);font-weight:600}
.specs dd{margin:0;font-size:13px;font-weight:600}
.fitbox{margin:0 16px;padding:12px 14px;border-radius:10px;display:flex;gap:10px;align-items:flex-start;background:var(--green-soft);color:#14532D;font-size:13px;line-height:1.4}
.fitbox.bad{background:var(--red-soft);color:#7C2D12}
.fitbox svg{width:18px;height:18px;flex-shrink:0;margin-top:1px}
.sticky{position:absolute;left:0;right:0;bottom:74px;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;z-index:4}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line-2);border-radius:10px;background:var(--surface);height:48px;flex-shrink:0}
.qty button{width:40px;height:44px;display:grid;place-items:center;color:var(--ink)}
.qty button svg{width:16px;height:16px}
.qty output{min-width:26px;text-align:center;font-weight:800;font-size:15px}
.sticky .btn{flex:1}

/* Cart */
.cline{display:flex;gap:12px;padding:14px;border-top:1px solid var(--line)}
.cline:first-child{border-top:0}
.cline .th{width:76px;height:76px;border-radius:8px;overflow:hidden;background:var(--surface-2);flex-shrink:0}
.cline .th img{width:100%;height:100%;object-fit:cover}
.cline .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.cline .t b{font-size:13.5px;font-weight:600;line-height:1.25}
.cline .t span{font-size:12px;color:var(--ink-2)}
.cline .bottom{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:4px}
.cline .qty{height:34px;border-radius:8px}
.cline .qty button{width:32px;height:30px}
.cline .qty output{font-size:13.5px;min-width:22px}
.cline .pr b{font-size:15px}
.summary{display:flex;flex-direction:column;gap:9px;padding:14px;font-size:14px}
.summary div{display:flex;justify-content:space-between;gap:12px;color:var(--ink-2)}
.summary div b{color:var(--ink);font-weight:600}
.summary .tot{border-top:1px solid var(--line);padding-top:10px;margin-top:2px;color:var(--ink);font-weight:800;font-size:17px}
.summary .tot b{font-size:17px;font-weight:800}
.save-banner{margin:0 16px;padding:12px 14px;border-radius:10px;background:var(--green-soft);display:flex;gap:12px;align-items:center;color:#14532D}
.save-banner b{font-size:22px;font-weight:800;color:var(--green);letter-spacing:-.4px}
.save-banner span{font-size:13px;line-height:1.35}
.promo-in{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.promo-in input{flex:1;min-width:0;height:40px;border:1.5px solid var(--line-2);border-radius:8px;padding:0 12px;font:inherit;font-size:13.5px;background:var(--surface);color:var(--ink)}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:48px 24px 20px;text-align:center;color:var(--ink-2)}
.empty svg{width:56px;height:56px;color:var(--line-2)}
.empty b{color:var(--ink);font-size:16px}
.done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:28px 20px 6px}
.done .ok{width:72px;height:72px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center}
.done .ok svg{width:34px;height:34px}
.done h2{font-size:22px;font-weight:800}
.done p{color:var(--ink-2);font-size:14px;line-height:1.45}

/* Garage */
.acft-hero{margin:0 16px;border-radius:12px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.acft-hero img{width:100%;height:170px;object-fit:cover}
.acft-hero .info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:3px}
.acft-hero h2{font-size:19px;font-weight:800;letter-spacing:-.3px}
.acft-hero p{font-size:13px;color:var(--ink-2)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:0 16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 12px 10px;display:flex;flex-direction:column;gap:6px}
.stat b{font-size:20px;font-weight:800;letter-spacing:-.4px}
.stat span{font-size:11.5px;color:var(--ink-2);line-height:1.2}
.bar{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--blue)}
.bar i.warn{background:var(--brand-deep)}
.bar i.due{background:var(--red)}
.acft-pick{display:flex;flex-direction:column;gap:10px;padding:0 16px}
.acft-card{display:flex;gap:12px;align-items:center;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);width:100%}
.acft-card[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.acft-card img{width:72px;height:56px;border-radius:6px;object-fit:cover;flex-shrink:0}
.acft-card .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.acft-card .t b{font-size:14px;font-weight:700}
.acft-card .t span{font-size:12px;color:var(--ink-2)}

.hobbs{display:flex;gap:0;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.hobbs > div{flex:1;display:flex;flex-direction:column;gap:1px;border-left:1px solid var(--line);padding-left:12px}
.hobbs > div:first-child{border-left:0;padding-left:0}
.hobbs span{font-size:11px;color:var(--ink-3);font-weight:600}
.hobbs b{font-size:15px;font-weight:800}
.logform{display:flex;flex-direction:column;gap:12px}
.logform label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.logform input{height:46px;border:1.5px solid var(--line-2);border-radius:10px;padding:0 12px;font:inherit;font-size:15px;font-weight:600;color:var(--ink);background:var(--surface);width:100%}
.logform input:focus{border-color:var(--ink);outline:none}
.logform .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.logsum{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--surface-2);border-radius:10px;font-size:14px;color:var(--ink-2)}
.logsum b{font-size:17px;color:var(--ink);font-weight:800}
.err{font-size:13px;color:var(--red);font-weight:600}

/* Account */
.me{display:flex;align-items:center;gap:14px;padding:16px}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}
.me b{font-size:16px;font-weight:800}
.me span{display:block;font-size:12.5px;color:var(--ink-2)}
.credits{padding:0 16px;font-size:11px;color:var(--ink-3);line-height:1.5}

/* Sheet */
.sheet-bg{position:absolute;inset:0;background:rgba(10,14,22,.45);z-index:8;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:16px 16px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));z-index:9;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:14px;max-height:80%;overflow-y:auto}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line-2);margin:0 auto}
.sheet h3{font-size:17px;font-weight:800}
.sheet .acft-pick{padding:0}

/* Tabs */
.tabs{position:absolute;left:0;right:0;bottom:0;height:74px;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--ink-3);border-radius:12px;min-height:44px;position:relative}
.tabs button svg{width:24px;height:24px}
.tabs button .f{display:none}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"] .o{display:none}
.tabs button[aria-current="page"] .f{display:block}
.tabs .cnt{top:2px;right:calc(50% - 24px)}

/* Toast */
.phone:has(.sticky:not([hidden])) .toast{bottom:148px}
.toast{position:absolute;left:16px;right:16px;bottom:88px;background:var(--ink);color:#fff;border-radius:10px;padding:12px 14px;font-size:13.5px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);transform:translateY(16px);opacity:0;transition:.2s;pointer-events:none;z-index:7}
.toast.show{transform:none;opacity:1}
.toast .th{width:34px;height:34px;border-radius:6px;overflow:hidden;background:#fff;flex-shrink:0}
.toast .th img{width:100%;height:100%;object-fit:cover}
.toast b{font-weight:700}
.toast .link{margin-left:auto;color:var(--brand)}
@media (prefers-reduced-motion:reduce){.toast,.sheet,.sheet-bg,.btn{transition:none}}
</style>
</head>
<body>
<div class="stage">
<div class="phone" id="app">

  <header class="hdr" id="hdr">
    <div class="hdr-row">
      <div class="wordmark">
        <span class="mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1400" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14l8-8 8 8"/><path d="M7 19l5-5 5 5"/></svg></span>
        <b>Hangar</b>
      </div>
      <div class="hdr-icons">
        <button class="icon-btn" aria-label="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0v4l2 3H4l2-3z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg><span class="dot" aria-hidden="true"></span></button>
        <button class="icon-btn" data-go="cart" aria-label="Cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 2-1.5L21 8H6.3"/><circle cx="10" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg><span class="cnt" data-cnt hidden>0</span></button>
      </div>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2M8 9v6M11 9v6M14 9v6M17 9v6"/></svg>

  </header>

  <div class="screens">
    <section class="screen" id="s-home" aria-label="Home"></section>
    <section class="screen" id="s-browse" aria-label="Browse" hidden></section>
    <section class="screen" id="s-product" aria-label="Product" hidden></section>
    <section class="screen" id="s-garage" aria-label="My aircraft" hidden></section>
    <section class="screen" id="s-cart" aria-label="Cart" hidden></section>
    <section class="screen" id="s-account" aria-label="Account" hidden></section>
  </div>

  <div class="sticky" id="stickyBar" hidden></div>

  <nav class="tabs" aria-label="Main">
    <button data-go="home" aria-current="page">
      <svg class="o" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
      <svg class="f" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l10 8.6V21a1 1 0 0 1-1 1h-6v-7H9v7H3a1 1 0 0 1-1-1v-9.9z"/></svg>Home</button>
    <button data-go="browse">
      <svg class="o" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>
      <svg class="f" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>Browse</button>
    <button data-go="garage">
      <svg class="o" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 3.5h3l1 6.5 6.5 3v2l-6.5-1.5-.6 4 2.1 1.5V21l-4-1-4 1v-2l2.1-1.5-.6-4L3 15v-2l6.5-3z"/></svg>
      <svg class="f" viewBox="0 0 24 24" fill="currentColor"><path d="M10.5 3.5h3l1 6.5 6.5 3v2l-6.5-1.5-.6 4 2.1 1.5V21l-4-1-4 1v-2l2.1-1.5-.6-4L3 15v-2l6.5-3z"/></svg>Garage</button>
    <button data-go="cart">
      <svg class="o" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 2-1.5L21 8H6.3"/><circle cx="10" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>
      <svg class="f" viewBox="0 0 24 24" fill="currentColor"><path d="M2.5 3h2.9a1 1 0 0 1 1 .8L7 6.5h13.3a1 1 0 0 1 1 1.2l-1.6 7.4a2 2 0 0 1-2 1.6H9.1a2 2 0 0 1-2-1.6L4.7 5H2.5z"/><circle cx="10" cy="20" r="1.6"/><circle cx="17" cy="20" r="1.6"/></svg>Cart<span class="cnt" data-cnt hidden>0</span></button>
    <button data-go="account">
      <svg class="o" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></svg>
      <svg class="f" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4.5"/><path d="M3.5 21a8.5 8.5 0 0 1 17 0z"/></svg>Account</button>
  </nav>

  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet" id="sheet" role="dialog" aria-label="Choose aircraft"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

/* ---------- small renderers ---------- */
function stars(p){ return `<span class="rate">${I.star}<b>${p.rating.toFixed(1)}</b>(${p.reviews.toLocaleString()})</span>`; }
function priceRow(p, big=false){
  const sel = p.line==='select';
  if (sel) return `<div class="pr"><b class="num">${money(p.select)}</b><s class="num">${money(p.genuine)}</s><em>${pctOff(p)}% off</em></div>`;
  return `<div class="pr"><b class="num">${money(p.genuine)}</b></div>`;
}
function card(p, opts={}){
  const f = fits(p);
  return `<article class="card ${opts.list?'list':''}">
    <button class="ph ${p.pad?'pad':''}" data-open="${p.id}" aria-label="${p.name}"><img src="${IMG[p.img]}" alt="" loading="lazy"></button>
    <button class="heart" data-save="${p.id}" aria-label="Save" aria-pressed="${state.saved.has(p.id)}">${I.heart}</button>
    <div class="body">
      ${p.line==='select' ? '<span class="tag sel">Textron Select</span>' : '<span class="tag">Genuine</span>'}
      <button class="nm" data-open="${p.id}">${p.name}</button>
      ${stars(p)}
      ${priceRow(p)}
      <span class="fit ${f?'':'no'}">${f?I.check:''}${f?'Fits your '+acft().name.split(' ').slice(1,2)[0]:'Check fitment'}</span>
    </div>
    <button class="add" data-add="${p.id}" aria-label="Add ${p.name} to cart">${I.plus}</button>
  </article>`;
}
function dueRows(){
  const a = acft();
  return PARTS.filter(p=>p.due && fits(p)).slice(0,4).map(p=>`<button class="row" data-open="${p.id}">
    <div class="th"><img src="${IMG[p.img]}" alt=""></div>
    <div class="t"><b>${p.name}</b><span class="pill ${p.dueNow?'due':'warn'}">${p.dueNow?'Due now':'Due in '+hrsTo100(a)+' hrs'}</span></div>
    <div class="r num">${money(p.line==='select'?p.select:p.genuine)}</div>${I.chev.replace('<svg','<svg class="chev"')}</button>`).join('');
}

function cartItems(){ return Object.entries(state.cart).map(([id,c])=>({p:byId[id], ...c})); }

function show(screen){
  if (screen!=='product') state.prev = state.screen;

  document.querySelectorAll('.screen').forEach(s=>s.hidden = s.id!=='s-'+screen);
  document.querySelectorAll('.tabs button').forEach(b=>{ if (b.dataset.go===screen) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  ({home:renderHome, browse:renderBrowse, product:renderProduct, garage:renderGarage, cart:renderCart, account:renderAccount})[screen]();

  const open = t.closest('[data-open]');
  if (open){ state.product = open.dataset.open; state.tier=null; state.qty=1; show('product'); return; }
  if (t.closest('[data-back]')){ show(state.prev==='product'?'home':state.prev); return; }
  const save = t.closest('[data-save]');
  if (save){ const id=save.dataset.save; const on = !state.saved.has(id); on ? state.saved.add(id) : state.saved.delete(id); document.querySelectorAll(`[data-save="${id}"]`).forEach(b=>b.setAttribute('aria-pressed', on)); return; }
  const add = t.closest('[data-add]');
  if (add){ addToCart(add.dataset.add, state.screen==='product' && add.dataset.add===state.product ? state.tier : null, +(add.dataset.qty||1)); return; }
  const chipC = t.closest('.chip[data-cat]'); if (chipC){ state.browseCat = chipC.dataset.cat; renderBrowse(); return; }
  const chipL = t.closest('.chip[data-line]'); if (chipL){ state.browseLine = chipL.dataset.line; renderBrowse(); return; }
  const tier = t.closest('.opt[data-tier]'); if (tier){ state.tier = tier.dataset.tier; renderProduct(); $('#s-product').scrollTop = $('#s-product').scrollTop; return; }
  const ship = t.closest('.opt[data-ship]'); if (ship){ ship.parentElement.querySelectorAll('.opt').forEach(o=>o.setAttribute('aria-pressed', o===ship)); return; }
  const q = t.closest('[data-q]'); if (q){ state.qty = Math.max(1, Math.min(20, state.qty + +q.dataset.q)); renderSticky(); return; }
  const cq = t.closest('[data-cq]'); if (cq){ const c = state.cart[cq.dataset.cq]; c.qty += +cq.dataset.d; if (c.qty<=0) delete state.cart[cq.dataset.cq]; badges(); renderCart(); renderSticky(); return; }
  if (t.closest('#checkout')){ state.cart = {}; badges(); state.orderDone = true; renderCart(); renderSticky(); $('#s-cart').scrollTop=0; return; }
  if (t.closest('#addKit')){ PARTS.filter(p=>p.due && fits(p)).forEach(p=>addToCart(p.id, null, 1)); toast(`<div><b>100-hour kit added</b><br><span style="opacity:.8">${PARTS.filter(p=>p.due && fits(p)).length} items for ${acft().reg}</span></div><button class="link" data-go="cart">View</button>`); return; }
  if (t.closest('#acftBtn') || t.closest('#switchAcft')){ openSheet(); return; }
  if (t.closest('#logFlight') || t.closest('#logFlight2')){ openLogSheet(); return; }
  if (t.closest('#sheetBg')){ closeSheet(); return; }
  const ac = t.closest('[data-acft]'); if (ac){ setAircraft(ac.dataset.acft); return; }
});
$('#q').addEventListener('input', ()=>{ if (state.screen!=='browse'){ state.browseCat='all'; state.browseLine='all'; show('browse'); } else renderBrowse(); });
$('#q').addEventListener('keydown', e=>{ if (e.key==='Enter'){ e.preventDefault(); if (state.screen!=='browse') show('browse'); } });
document.addEventListener('keydown', e=>{ if (e.key==='Escape') closeSheet(); });

renderHeader(); show('home'); badges();
</script>

</body>
</html>
